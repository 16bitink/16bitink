<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>InkRoad world view</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #f3ead8; overflow: hidden; font: 13px system-ui, sans-serif; }
    #game { position: fixed; inset: 0; touch-action: none; }
    #bar { position: fixed; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 70vw; }
    #bar button { font: inherit; padding: 6px 9px; }
    #say { position: fixed; right: 8px; top: 8px; max-width: 320px; padding: 6px 10px; background: rgba(251,245,230,.92); border: 1px solid #3a322b; white-space: pre-wrap; }
    .bare #bar, .bare #say { display: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="bar"></div>
  <div id="say"></div>
  <script type="module" src="./view.ts"></script>
</body>
</html>
