<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InkRoad motion lab</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; background: #1d1f22; color: #ddd; font: 13px/1.4 ui-monospace, Menlo, monospace; }
    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 12px; background: #2a2d31; }
    header select, header button { font: inherit; background: #3a3e44; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 3px 8px; }
    header button.on { background: #6b4a1e; }
    main { display: grid; grid-template-columns: 1fr 380px; gap: 8px; padding: 8px; }
    #view { width: 100%; background: #c9bd98; border-radius: 4px; cursor: grab; }
    #timeline { width: 100%; height: 44px; background: #2a2d31; border-radius: 4px; cursor: pointer; display: block; margin-top: 6px; }
    #side { max-height: calc(100vh - 70px); overflow: auto; }
    #side h3 { margin: 6px 0 4px; font-size: 13px; color: #f0c674; }
    .ok { color: #8fbf6a; } .bad { color: #ef6b5f; }
    #viol div { cursor: pointer; padding: 1px 4px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #viol div:hover, #viol div.here { background: #4a2d2d; }
    #status { color: #aaa; }
  </style>
</head>
<body>
  <header>
    <b>Motion lab</b>
    <select id="scenario"></select>
    <label><input type="checkbox" id="sw-ROOMY_CORNERS"> ROOMY_CORNERS</label>
    <label><input type="checkbox" id="sw-GAP_ACCEPT"> GAP_ACCEPT</label>
    <button id="run">Run</button>
    <button id="play">Play</button>
    <button id="back">&lt; frame</button>
    <button id="fwd">frame &gt;</button>
    <button id="prevViol">&lt;&lt; violation</button>
    <button id="nextViol">violation &gt;&gt;</button>
    <label>speed <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
    <label><input type="checkbox" id="trails" checked> trails</label>
    <span id="status"></span>
  </header>
  <main>
    <div>
      <canvas id="view" width="1120" height="720"></canvas>
      <canvas id="timeline" width="1120" height="44"></canvas>
    </div>
    <div id="side"></div>
  </main>
  <script type="module" src="./motionPage.ts"></script>
</body>
</html>
